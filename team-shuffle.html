<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>팀 셔플러</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/team-shuffle.css">
</head>
<body>
  <div class="page-wrapper">
    <div class="top-bar">
      <a href="index.html" class="back-btn">← 게임 허브</a>
      <button class="theme-toggle" id="themeToggle" type="button">
        <span class="toggle-icon">🌙</span>
        <span class="toggle-label">라이트 모드</span>
      </button>
    </div>

    <div class="header">
      <h1>팀 셔플러</h1>
      <p>명단을 넣고 조를 나눠 보세요 — 이름 카드가 한 장씩 날아가 조에 꽂힙니다.</p>
    </div>

    <!-- 1) 준비: 명단·나누기 기준·제약 -->
    <section class="setup" id="setupSection">
      <div class="setup-bar">
        <div class="count-picker" id="countPicker">
          <span class="setup-label">인원수</span>
        </div>
        <button class="pill-btn" id="rosterToggle" type="button">📋 명단 붙여넣기</button>
      </div>

      <div class="roster-box" id="rosterBox" hidden>
        <textarea id="rosterInput" placeholder="명단을 그대로 붙여넣으세요&#10;예) 1. 김민준 (개발팀) 010-1234-5678&#10;    2. 이서연 / 디자인팀&#10;한 줄로: 김민준, 이서연, 박지호"></textarea>
        <div class="roster-actions">
          <span class="roster-hint" id="rosterHint">번호·부서·직급·연락처는 걸러내고 이름만 뽑습니다</span>
          <button class="btn-icon" id="rosterClearBtn" type="button">지우기</button>
          <button class="btn-icon roster-apply" id="rosterApplyBtn" type="button">명단 적용</button>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header">
          참가자
          <span class="panel-badge" id="playerBadge">0</span>
        </div>
        <ol class="player-grid" id="playerGrid"></ol>
        <button class="panel-add-btn" id="addPlayerBtn" type="button">＋ 참가자 추가</button>
      </div>

      <div class="options-grid">
        <div class="panel">
          <div class="panel-header">나누기 기준</div>
          <div class="seg" role="group" aria-label="나누기 기준">
            <button class="seg-btn" type="button" data-mode="teams">팀 수로</button>
            <button class="seg-btn" type="button" data-mode="size">팀당 인원으로</button>
          </div>
          <div class="stepper">
            <button class="step-btn" id="stepDown" type="button" aria-label="하나 줄이기">−</button>
            <span class="step-value" id="stepValue">3</span>
            <span class="step-unit" id="stepUnit">개 조</span>
            <button class="step-btn" id="stepUp" type="button" aria-label="하나 늘리기">＋</button>
          </div>
          <p class="split-preview" id="splitPreview"></p>
        </div>

        <div class="panel">
          <div class="panel-header">제약 <span class="panel-badge" id="constraintBadge">0</span></div>
          <div class="sub-title">🚫 같은 팀 금지</div>
          <div class="pair-form">
            <select id="pairA" aria-label="첫 번째 사람"></select>
            <span class="pair-sep">↔</span>
            <select id="pairB" aria-label="두 번째 사람"></select>
            <button class="btn-icon roster-apply" id="pairAddBtn" type="button">추가</button>
          </div>
          <ul class="pair-list" id="pairList"></ul>
          <div class="sub-title">👑 조장 후보</div>
          <p class="leader-info" id="leaderInfo"></p>
        </div>
      </div>

      <div class="constraint-msg" id="constraintMsg" role="alert" hidden></div>

      <div class="control-bar">
        <button class="btn btn-primary btn-big" id="startBtn" type="button">🔀 조 편성 시작</button>
      </div>
      <p class="setup-tip">프로젝터에 띄워 함께 보세요. 남는 인원은 앞 조부터 한 명씩 더 들어갑니다.</p>
    </section>

    <!-- 2) 결과: 카드가 날아가 조에 꽂힌다 -->
    <section class="result" id="resultSection" hidden>
      <div class="result-bar">
        <div class="seg speed-seg" role="group" aria-label="속도">
          <button class="seg-btn" type="button" data-speed="slow">느리게</button>
          <button class="seg-btn" type="button" data-speed="normal">보통</button>
          <button class="seg-btn" type="button" data-speed="fast">빠르게</button>
        </div>
        <button class="deck" id="deck" type="button" title="눌러서 다음 카드 바로 보내기">
          <span class="deck-stack" aria-hidden="true"></span>
          <span class="deck-label">남은 이름 <b id="deckCount">0</b></span>
        </button>
        <div class="result-actions">
          <button class="btn-icon" id="skipBtn" type="button">⏭ 한 번에 보기</button>
          <button class="btn-icon" id="reshuffleBtn" type="button">🔀 다시 섞기</button>
          <button class="btn-icon" id="copyBtn" type="button">📋 결과 복사</button>
          <button class="btn-icon" id="backBtn" type="button">⚙️ 설정으로</button>
        </div>
      </div>
      <p class="result-info" id="resultInfo"></p>
      <div class="team-grid" id="teamGrid"></div>
    </section>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/roster.js"></script>
  <script src="js/team-shuffle.js"></script>
</body>
</html>
